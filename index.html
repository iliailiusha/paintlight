<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art of Strokes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
    font-family: 'Inter', sans-serif;
    background: #0a0a0a;
    cursor: none;
    color: #fff;
    user-select: none;
}

#cursorGlow {
    position: fixed; pointer-events: none;
    width: 300px; height: 300px; border-radius: 50%;
    background: radial-gradient(circle at center,
        rgba(255,255,240,0.08) 0%, rgba(255,245,200,0.03) 30%,
        rgba(255,235,160,0.008) 60%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    z-index: 2; transition: width .3s, height .3s, opacity .3s;
    mix-blend-mode: screen;
}
#cursorGlow.active { width: 400px; height: 400px; }
#cursorGlow.dim { opacity: 0.15 !important; }
#cursorPoint {
    position: fixed; pointer-events: none;
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,240,0.7);
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    z-index: 10;
    box-shadow: 0 0 20px rgba(255,245,200,0.3), 0 0 60px rgba(255,235,160,0.1);
    transition: width .15s, height .15s, background .3s, opacity .3s;
}
#cursorPoint.active { width: 12px; height: 12px; background: rgba(255,240,180,0.7); }
#cursorPoint.dim { opacity: 0.15 !important; }

#paintCanvas, #savedCanvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; z-index: 1;
    pointer-events: none;
}
#savedCanvas { z-index: 0; }
.bg-shapes {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; z-index: 0; overflow: hidden;
}
.shape {
    position: absolute; border-radius: 50%;
    filter: blur(80px); opacity: 0.3;
    animation: floatShape 20s ease-in-out infinite;
}
.shape-1 { width: 500px; height: 400px; background: radial-gradient(ellipse,rgba(255,255,255,0.15),transparent); top: -10%; left: -10%; }
.shape-2 { width: 600px; height: 350px; background: radial-gradient(ellipse,rgba(255,245,200,0.12),transparent); bottom: -15%; right: -5%; animation-delay: -5s; }
.shape-3 { width: 400px; height: 500px; background: radial-gradient(ellipse,rgba(255,240,180,0.08),transparent); top: 40%; left: 50%; animation-delay: -10s; }
.shape-4 { width: 300px; height: 600px; background: linear-gradient(180deg,rgba(255,255,255,0.06),rgba(255,240,180,0.04)); top: 10%; right: 30%; animation-delay: -15s; filter: blur(120px); }
.shape-5 { width: 700px; height: 300px; background: linear-gradient(90deg,rgba(255,250,230,0.05),rgba(255,235,180,0.08)); bottom: 5%; left: 20%; animation-delay: -8s; filter: blur(100px); }
@keyframes floatShape {
    0%,100%{transform:translate(0,0)scale(1)rotate(0deg)}
    25%{transform:translate(80px,-60px)scale(1.1)rotate(5deg)}
    50%{transform:translate(-40px,40px)scale(0.95)rotate(-3deg)}
    75%{transform:translate(60px,80px)scale(1.05)rotate(4deg)}
}
.splatter { position: fixed; pointer-events: none; z-index: 0; opacity: 0.03; }
.splatter-1 { top: 15%; left: 5%; width: 150px; height: 150px; background: radial-gradient(circle at 30% 30%,rgba(255,255,255,0.4),transparent 70%); border-radius: 60% 40% 50% 50%/40% 50% 50% 60%; animation: morphSplatter 8s ease-in-out infinite; }
.splatter-2 { bottom: 10%; right: 3%; width: 200px; height: 120px; background: radial-gradient(circle at 50% 50%,rgba(255,240,180,0.3),transparent 70%); border-radius: 50% 50% 30% 70%/60% 40% 60% 40%; animation: morphSplatter 10s ease-in-out infinite reverse; }
.splatter-3 { top: 50%; right: 8%; width: 100px; height: 200px; background: radial-gradient(circle at 50% 50%,rgba(255,250,230,0.2),transparent 60%); border-radius: 40% 60% 60% 40%/50% 40% 60% 50%; animation: morphSplatter 12s ease-in-out infinite; }
@keyframes morphSplatter {
    0%,100%{border-radius:60% 40% 50% 50%/40% 50% 50% 60%;transform:rotate(0deg)scale(1)}
    33%{border-radius:40% 60% 60% 40%/50% 40% 60% 50%;transform:rotate(10deg)scale(1.1)}
    66%{border-radius:50% 50% 40% 60%/60% 50% 50% 40%;transform:rotate(-5deg)scale(0.95)}
}

main {
    position: relative; z-index: 3;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; padding: 2rem; text-align: center;
    transition: opacity 0.5s;
}
nav {
    position: fixed; top: 0; left: 0; width: 100%;
    padding: 2rem 4rem; display: flex;
    justify-content: space-between; align-items: center;
    z-index: 10;
}
.logo { font-family: 'Playfair Display',serif; font-size: 1.5rem; font-weight: 700; letter-spacing: 2px; color: rgba(255,255,255,0.9); text-shadow: 0 0 30px rgba(255,245,200,0.3); }
.logo span { color: rgba(255,240,180,0.8); }
.nav-links { display: flex; gap: 2.5rem; list-style: none; }
.nav-links a { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.85rem; letter-spacing: 1.5px; text-transform: uppercase; transition: color .4s; position: relative; padding-bottom: 4px; }
.nav-links a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 1px; background: linear-gradient(90deg,rgba(255,255,255,0.8),rgba(255,240,180,0.6)); transition: width .5s cubic-bezier(.25,1,.5,1); }
.nav-links a:hover { color: rgba(255,255,255,0.95); }
.nav-links a:hover::after { width: 100%; }

.hero { max-width: 900px; }
.hero-subtitle { font-size: 0.85rem; letter-spacing: 4px; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 1.5rem; display: inline-block; }
.hero-subtitle::before,.hero-subtitle::after { content: '—'; margin: 0 1rem; color: rgba(255,240,180,0.4); }
.hero h1 { font-family: 'Playfair Display',serif; font-size: clamp(3rem,8vw,7rem); font-weight: 400; line-height: 1.1; margin-bottom: 1.5rem; }
.hero h1 .line { display: block; opacity: 0; animation: fadeUp .5s ease forwards; }
.hero h1 .line:nth-child(1) { animation-delay: 0.15s; }
.hero h1 .line:nth-child(2) { animation-delay: 0.3s; }
.hero h1 .highlight { font-style: italic; background: linear-gradient(135deg,rgba(255,255,255,0.9),rgba(255,240,180,0.7)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.hero p { font-size: 1.1rem; color: rgba(255,255,255,0.5); max-width: 600px; margin: 0 auto 3rem; line-height: 1.8; font-weight: 300; letter-spacing: 0.5px; opacity: 0; animation: fadeUp .5s ease 0.45s forwards; }
.btn-group { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; opacity: 0; animation: fadeUp .5s ease 0.6s forwards; }

.btn { position: relative; padding: 1rem 2.5rem; font-family: 'Inter',sans-serif; font-size: 0.85rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; border: none; cursor: none; transition: transform .3s cubic-bezier(.34,1.56,.64,1); overflow: hidden; border-radius: 0; background: transparent; color: #fff; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn-primary { border: 1.5px solid rgba(255,255,255,0.3); }
.btn-primary .btn-bg { position: absolute; top: 0; left: 0; width: 0; height: 100%; background: linear-gradient(90deg,rgba(255,255,255,0.15),rgba(255,245,200,0.1),rgba(255,240,180,0.08)); transition: width .6s cubic-bezier(.25,1,.5,1); }
.btn-primary::before { content: ''; position: absolute; top: -1.5px; left: -1.5px; width: calc(100% + 3px); height: calc(100% + 3px); border: 1.5px solid transparent; background: linear-gradient(135deg,rgba(255,255,255,0.6),rgba(255,240,180,0.3)) border-box; -webkit-mask: linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; transition: opacity .4s; }
.btn-primary:hover { transform: translateY(-2px); }
.btn-primary:hover .btn-bg { width: 100%; }
.btn-primary:hover::before { opacity: 1; }
.btn-primary .btn-drip { position: absolute; bottom: -2px; left: 20%; width: 2px; height: 0; background: linear-gradient(180deg,rgba(255,255,255,0.6),transparent); transition: height .6s ease .3s; }
.btn-primary:hover .btn-drip { height: 25px; }
.btn-primary .btn-drip:nth-child(4) { left: 50%; transition-delay: .4s; }
.btn-primary .btn-drip:nth-child(5) { left: 75%; transition-delay: .5s; }
.btn-text { position: relative; z-index: 2; }

.btn-secondary { border: none; color: rgba(255,255,255,0.6); }
.btn-secondary .btn-underline { position: absolute; bottom: 0; left: 0; width: 100%; height: 1px; background: linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent); transform: scaleX(0); transition: transform .5s cubic-bezier(.25,1,.5,1); transform-origin: left; }
.btn-secondary:hover { color: rgba(255,255,255,0.95); transform: translateY(-2px); }
.btn-secondary:hover .btn-underline { transform: scaleX(1); }
.btn-secondary .btn-particle { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: rgba(255,240,180,0.6); top: 50%; left: 50%; transform: translate(-50%,-50%); opacity: 0; pointer-events: none; }
.btn-secondary:hover .btn-particle { animation: particleBurst .8s ease forwards; }
@keyframes particleBurst { 0% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx,40px)),calc(-50% + var(--dy,-30px))) scale(0); } }

.scroll-indicator { position: fixed; bottom: 3rem; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; opacity: 0; animation: fadeUp .5s ease 1s forwards; }
.scroll-indicator span { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.25); }
.scroll-line { width: 1px; height: 40px; background: linear-gradient(180deg,rgba(255,255,255,0.3),transparent); animation: scrollPulse 2s ease-in-out infinite; }
@keyframes scrollPulse { 0%,100%{transform:scaleY(0.5);opacity:0.3} 50%{transform:scaleY(1);opacity:0.8} }

#pageTransition{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;pointer-events:none;background:#0a0a0a;opacity:0;transition:opacity .5s ease;transform:translateZ(0)}
#pageTransition.active{opacity:1;pointer-events:auto}
#pickTriangle{position:fixed;pointer-events:auto;z-index:50;width:24px;height:24px;cursor:grab}
#pickTriangle::before{content:'▲';position:absolute;font-size:18px;color:rgba(255,240,180,0.8);top:50%;left:50%;transform:translate(-50%,-50%);transition:color .2s}
#pickTriangle.grabbing{cursor:grabbing}
#pickTriangle.grabbing::before{color:rgba(255,240,180,1);text-shadow:0 0 20px rgba(255,240,180,0.6),0 0 40px rgba(255,240,180,0.3)}
#pickTriangle .glow-ring{position:absolute;top:50%;left:50%;width:200px;height:200px;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(255,240,180,0.15);pointer-events:none;animation:triPulse 1.5s ease-in-out infinite;opacity:0;transition:opacity .3s}
#pickTriangle.grabbing .glow-ring{opacity:1}
@keyframes triPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.3}50%{transform:translate(-50%,-50%) scale(1.15);opacity:0.6}}
#pickTriangle .glow-fill{position:absolute;top:50%;left:50%;width:180px;height:180px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,240,180,0.06),transparent 70%);pointer-events:none;opacity:0;transition:opacity .3s}
#pickTriangle.grabbing .glow-fill{opacity:1}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;z-index:20;padding:8px;background:none;border:none;position:relative}
.hamburger span{display:block;width:24px;height:1.5px;background:rgba(255,255,255,0.6);transition:all .3s;transform-origin:center}
.hamburger.active span:nth-child(1){transform:rotate(45deg)translate(4px,5px)}
.hamburger.active span:nth-child(2){opacity:0}
.hamburger.active span:nth-child(3){transform:rotate(-45deg)translate(4px,-5px)}
.mobile-menu{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,10,10,0.97);z-index:15;flex-direction:column;align-items:center;justify-content:center;gap:2.5rem}
.mobile-menu.active{display:flex}
.mobile-menu a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:1.1rem;letter-spacing:2.5px;text-transform:uppercase;transition:color .4s}
.mobile-menu a:hover{color:rgba(255,255,255,0.95)}
@media (max-width: 768px) {
    nav { padding: 1.2rem 1.5rem; }
    .nav-links { display: none; }
    .hamburger { display: flex; }
    .btn-group { flex-direction: column; align-items: center; width: 100%; max-width: 300px; }
    .btn { width: 100%; padding: 0.9rem 1.5rem; font-size: 0.8rem; }
    .hero h1 { font-size: clamp(2rem, 10vw, 2.5rem); }
    .hero p { font-size: 0.9rem; padding: 0 1rem; }
    .scroll-indicator { bottom: 1rem; }
    .hero-subtitle { font-size: 0.7rem; }
    .logo { font-size: 1.2rem; }
    .hero { padding: 0 1rem; }
    #cursorGlow, #cursorPoint { display: none; }
    body { cursor: auto; }
    .btn { cursor: pointer; }
    .nav-links a, .mobile-menu a, #trailMenu button, #clearAllBtn { cursor: pointer; }
    #pickTriangle { display: none; }
}
</style>
</head>
<body>

<div class="bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
    <div class="shape shape-5"></div>
</div>
<div class="splatter splatter-1"></div>
<div class="splatter splatter-2"></div>
<div class="splatter splatter-3"></div>

<canvas id="paintCanvas"></canvas>
<canvas id="savedCanvas"></canvas>

<div id="cursorGlow"></div>
<div id="cursorPoint"></div>
<div id="pickTriangle"><div class="glow-ring"></div><div class="glow-fill"></div></div>
<div id="pageTransition"></div>

<nav>
    <a href="index.html" style="color:inherit;text-decoration:none" class="logo">PAINTLIGHT <span>▲</span></a>
    <ul class="nav-links">
        <li><a href="works.html">Работы</a></li>
        <li><a href="about.html">О нас</a></li>

    </ul>
    <button class="hamburger" id="hamburger" aria-label="Меню">
        <span></span><span></span><span></span>

<main>
    <div class="hero">
        <div class="hero-subtitle">Искусство движения</div>
        <h1>
            <span class="line">Там, где <span class="highlight">свет</span></span>
            <span class="line">встречает <span class="highlight">краску</span></span>
        </h1>
        <p>Каждое движение оставляет след. Веди курсором, рисуй светом, сохраняй мазки кликом. Удали след правой кнопкой.</p>
        <div class="btn-group">
            <a href="game.html" class="btn btn-primary" id="btnStart">
                <span class="btn-bg"></span>

                <span class="btn-underline"></span>
                <span class="btn-particle" style="--dx:40px;--dy:-30px"></span>
                <span class="btn-particle" style="--dx:-35px;--dy:25px"></span>

                <span class="btn-text">О проекте</span>
            </a>
        </div>
    </div>
</main>

<div class="scroll-indicator">
    <span>Листайте</span>
    <div class="scroll-line"></div>
</div>

<div id="trailMenu" style="display:none;position:fixed;z-index:20;background:rgba(20,20,20,0.9);border:1px solid rgba(255,255,255,0.1);padding:0.5rem 0;border-radius:0;min-width:140px;">
    <button id="deleteTrailBtn" style="background:none;border:none;color:rgba(255,255,255,0.6);font-family:'Inter',sans-serif;font-size:0.75rem;letter-spacing:1px;text-transform:uppercase;cursor:none;padding:0.5rem 1.2rem;width:100%;text-align:left;transition:color .2s;">✕ Удалить след</button>
    <button id="shareTrailBtn" style="background:none;border:none;color:rgba(255,255,255,0.6);font-family:'Inter',sans-serif;font-size:0.75rem;letter-spacing:1px;text-transform:uppercase;cursor:none;padding:0.5rem 1.2rem;width:100%;text-align:left;transition:color .2s;">🌐 Сделать общим</button>
</div>
<div id="clearAllBtn" style="display:none;position:fixed;bottom:20px;right:20px;z-index:15;background:rgba(20,20,20,0.85);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.4);font-family:'Inter',sans-serif;font-size:0.65rem;letter-spacing:1px;text-transform:uppercase;padding:0.4rem 1rem;cursor:pointer;transition:color .2s,border-color .2s;" onmouseover="this.style.color='rgba(255,100,100,0.85)';this.style.borderColor='rgba(255,100,100,0.3')" onmouseout="this.style.color='rgba(255,255,255,0.4)';this.style.borderColor='rgba(255,255,255,0.1)'">✕ Очистить все</div>

<div class="mobile-menu" id="mobileMenu">
    <a href="works.html">Работы</a>
    <a href="about.html">О нас</a>
    <a href="contact.html">Контакты</a>
</div>
<script src="gaze-tracker.js"></script>
<script>
const canvas=document.getElementById('paintCanvas'),ctx=canvas.getContext('2d');
const savedCanvas=document.getElementById('savedCanvas'),sctx=savedCanvas.getContext('2d');
const cursorGlow=document.getElementById('cursorGlow'),cursorPoint=document.getElementById('cursorPoint');
let W,H;
function resize(){W=canvas.width=savedCanvas.width=window.innerWidth;H=canvas.height=savedCanvas.height=window.innerHeight}
window.addEventListener('resize',()=>{resize();redrawAllSaved()});resize();

const interactiveSel='a,button,.btn,.btn-primary,.btn-secondary,#btnStart,nav *,.hero h1,.hero p,.hero-subtitle,.logo,.scroll-indicator,.hamburger,.mobile-menu a';
let interactiveRects=[];
function updateInteractiveRects(){interactiveRects=Array.from(document.querySelectorAll(interactiveSel)).filter(e=>e.offsetParent!==null).map(e=>e.getBoundingClientRect())}
updateInteractiveRects();window.addEventListener('resize',updateInteractiveRects);
function isPointOverInteractive(x,y,r){r=r||4;for(const rect of interactiveRects){if(x+r>=rect.left&&x-r<=rect.right&&y+r>=rect.top&&y-r<=rect.bottom)return true}return false}

let mouseX=W/2,mouseY=H/2;
document.addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY;mouseDown=(e.buttons&1)!==0;cursorGlow.style.left=mouseX+'px';cursorGlow.style.top=mouseY+'px';cursorPoint.style.left=mouseX+'px';cursorPoint.style.top=mouseY+'px';const dim=isPointOverInteractive(mouseX,mouseY,20);if(dim){cursorGlow.classList.add('dim');cursorPoint.classList.add('dim')}else{cursorGlow.classList.remove('dim');cursorPoint.classList.remove('dim')};cursorGlow.classList.add('active');cursorPoint.classList.add('active');clearTimeout(cursorGlow._timer);cursorGlow._timer=setTimeout(()=>{cursorGlow.classList.remove('active');cursorPoint.classList.remove('active')},200)});
document.addEventListener('mouseleave',()=>{cursorGlow.style.opacity='0';cursorPoint.style.opacity='0'});
document.addEventListener('mouseenter',()=>{cursorGlow.style.opacity='1';cursorPoint.style.opacity='1'});

const trail=[],TRAIL_TIME=600;let px=mouseX,py=mouseY;
document.addEventListener('mousemove',e=>{if(pickTri.active)return;const spd=Math.hypot(e.clientX-px,e.clientY-py);if(spd>1){trail.push({x:e.clientX,y:e.clientY,op:Math.min(1,spd/30),sz:Math.min(10,3+spd*0.25),t:Date.now()});if(!_frameOn)_frameOn=true,requestAnimationFrame(drawTrail)};px=e.clientX;py=e.clientY;if(!mouseDown&&trail.length>500)trail.splice(0,trail.length-500)});

let savedTrails=JSON.parse(localStorage.getItem('pl_trails_index')||localStorage.getItem('pl_trails')||'[]'),sharedTrails=JSON.parse(localStorage.getItem('pl_trails_shared')||'[]'),trailIdCounter=savedTrails.reduce((m,t)=>Math.max(m,t.id),-1)+1,mouseDown=false,lastMouseUpTarget='',_frameOn=0;
let shareIdCounter=sharedTrails.reduce((m,t)=>Math.max(m,t.id),-1)+1;
// pickable triangle & selection
let pickTri={active:false,x:0,y:0,painted:false,justPainted:false},selectedSet=new Set(),draggingSel=false,selDragOffX=0,selDragOffY=0,selDragStartX=0,selDragStartY=0;
let selHighlightR=90; // selection radius from triangle
function updateTriPos(){const s=document.querySelector('.logo span');if(!s)return;const r=s.getBoundingClientRect();pickTri.ox=r.left+r.width/2;pickTri.oy=r.top+r.height/2;const el=document.getElementById('pickTriangle');el.style.left=(pickTri.ox-12)+'px';el.style.top=(pickTri.oy-12)+'px'}
updateTriPos();window.addEventListener('resize',updateTriPos);
document.getElementById('pickTriangle').addEventListener('mousedown',function(e){e.preventDefault();e.stopPropagation();pickTri.active=true;pickTri.painted=false;pickTri.x=mouseX;pickTri.y=mouseY;this.classList.add('grabbing');document.getElementById('pickTriangle').style.left=(mouseX-12)+'px';document.getElementById('pickTriangle').style.top=(mouseY-12)+'px'});
document.addEventListener('mousemove',e=>{if(pickTri.active){pickTri.x=e.clientX;pickTri.y=e.clientY;document.getElementById('pickTriangle').style.left=(e.clientX-12)+'px';document.getElementById('pickTriangle').style.top=(e.clientY-12)+'px';drawSelectionGlow();if(e.buttons&2){pickTri.painted=true;accumulateSelection()}}});
document.addEventListener('mouseup',e=>{if(pickTri.active&&e.button===0){pickTri.active=false;document.getElementById('pickTriangle').classList.remove('grabbing');updateTriPos();clearSelectionGlow();if(!pickTri.painted)selectTrailsInRadius();pickTri.painted=false}else if(pickTri.active&&e.button===2){pickTri.justPainted=pickTri.painted}});
function selectTrailsInRadius(){selectedSet.clear();for(let i=0;i<savedTrails.length;i++){const st=savedTrails[i];for(const p of st.points){if(Math.hypot(p.x-pickTri.x,p.y-pickTri.y)<selHighlightR){selectedSet.add(i);break}}}redrawAllSaved()}
function accumulateSelection(){for(let i=0;i<savedTrails.length;i++){if(selectedSet.has(i))continue;const st=savedTrails[i];for(const p of st.points){if(Math.hypot(p.x-pickTri.x,p.y-pickTri.y)<selHighlightR){selectedSet.add(i);break}}}redrawAllSaved()}
let selGlowCanvas=null;
function drawSelectionGlow(){if(!selGlowCanvas){selGlowCanvas=document.createElement('canvas');selGlowCanvas.width=W;selGlowCanvas.height=H;selGlowCanvas.style.cssText='position:fixed;top:0;left:0;z-index:9;pointer-events:none';document.body.appendChild(selGlowCanvas)}const sc=selGlowCanvas.getContext('2d');sc.clearRect(0,0,W,H);const grd=sc.createRadialGradient(pickTri.x,pickTri.y,0,pickTri.x,pickTri.y,selHighlightR);grd.addColorStop(0,'rgba(255,240,180,0.08)');grd.addColorStop(0.5,'rgba(255,240,180,0.03)');grd.addColorStop(1,'rgba(255,240,180,0)');sc.fillStyle=grd;sc.beginPath();sc.arc(pickTri.x,pickTri.y,selHighlightR,0,Math.PI*2);sc.fill();sc.strokeStyle='rgba(255,240,180,0.12)';sc.lineWidth=1;sc.beginPath();sc.arc(pickTri.x,pickTri.y,selHighlightR,0,Math.PI*2);sc.stroke()}
function clearSelectionGlow(){if(selGlowCanvas){selGlowCanvas.getContext('2d').clearRect(0,0,W,H);selGlowCanvas.remove();selGlowCanvas=null}}
// selected trails drag
document.addEventListener('mousedown',e=>{if(pickTri.active||e.button!==0)return;if(e.target.closest('#trailMenu,#deleteTrailBtn,#shareTrailBtn,#clearAllBtn,#pickTriangle'))return;if(selectedSet.size>0){let onSel=false;for(const idx of selectedSet){const st=savedTrails[idx];for(const p of st.points){if(Math.hypot(e.clientX-p.x,e.clientY-p.y)<15){onSel=true;pushUndo();draggingSel=true;selDragOffX=0;selDragOffY=0;selDragStartX=e.clientX;selDragStartY=e.clientY;break}}if(onSel)break}if(!onSel){selectedSet.clear();redrawAllSaved()}}})
document.addEventListener('mousemove',e=>{if(pickTri.active)return;if(draggingSel&&selectedSet.size>0){const dx=e.clientX-selDragStartX,dy=e.clientY-selDragStartY;selDragStartX=e.clientX;selDragStartY=e.clientY;for(const idx of selectedSet){const st=savedTrails[idx];for(const p of st.points){p.x+=dx;p.y+=dy}}syncStorage();redrawAllSaved()}});
document.addEventListener('mouseup',e=>{if(draggingSel){draggingSel=false;if(Math.hypot(e.clientX-selDragStartX,e.clientY-selDragStartY)>2)syncStorage()}});
function isPointInSel(x,y){for(const idx of selectedSet){const st=savedTrails[idx];for(const p of st.points){if(Math.hypot(x-p.x,y-p.y)<20)return true}}return false}
// close selection on click empty
document.addEventListener('click',function(e){if(selectedSet.size>0&&!e.target.closest('#trailMenu,#deleteTrailBtn,#shareTrailBtn,#clearAllBtn,#pickTriangle')&&!isPointInSel(e.clientX,e.clientY)&&!pickTri.active){selectedSet.clear();redrawAllSaved()}});
function syncStorage(){localStorage.setItem('pl_trails_index',JSON.stringify(savedTrails));localStorage.setItem('pl_trails_shared',JSON.stringify(sharedTrails))}
const MAX_UNDO=30;let undoStack=[];
function pushUndo(){undoStack.push({s:JSON.parse(JSON.stringify(savedTrails)),sh:JSON.parse(JSON.stringify(sharedTrails))});if(undoStack.length>MAX_UNDO)undoStack.shift()}
function undo(){if(!undoStack.length)return;const u=undoStack.pop();savedTrails=u.s;sharedTrails=u.sh;trailIdCounter=savedTrails.reduce((m,t)=>Math.max(m,t.id),-1)+1;shareIdCounter=sharedTrails.reduce((m,t)=>Math.max(m,t.id),-1)+1;selectedSet.clear();syncStorage();redrawAllSaved()}
document.addEventListener('mousedown',()=>mouseDown=true);
document.addEventListener('mouseup',e=>{mouseDown=false;if(e.button!==0||e.target.closest('a,button,.btn,.hamburger,#deleteTrailBtn,#trailMenu,#clearAllBtn,#pickTriangle'))return;if(trail.length>4){pushUndo();savedTrails.push({id:trailIdCounter++,points:trail.map(p=>({x:p.x,y:p.y,op:p.op,sz:p.sz})),createdAt:Date.now()});syncStorage();const st=savedTrails[savedTrails.length-1];const pts=st.points;if(pts.length>3)for(let i=0;i<pts.length-3;i++){const p=pts[i+1],ax=(pts[i].x+pts[i+1].x+pts[i+2].x+pts[i+3].x)/4,ay=(pts[i].y+pts[i+1].y+pts[i+2].y+pts[i+3].y)/4,alpha=0.35*(0.4+0.6*p.op);if(alpha>0.01)drawStroke(sctx,pts[i],pts[i+1],pts[i+2],pts[i+3],p.sz*0.9,alpha)};trail.length=0}});
document.addEventListener('touchend',e=>{mouseDown=false;if(e.target.closest('#trailMenu,#deleteTrailBtn,#clearAllBtn,#hamburger,a,button'))return;if(trail.length>4){pushUndo();savedTrails.push({id:trailIdCounter++,points:trail.map(p=>({x:p.x,y:p.y,op:p.op,sz:p.sz})),createdAt:Date.now()});syncStorage();trail.length=0}});

window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.code==='KeyZ'){e.preventDefault();undo()}});
redrawAllSaved();

const trailMenu=document.getElementById('trailMenu'),deleteTrailBtn=document.getElementById('deleteTrailBtn'),shareTrailBtn=document.getElementById('shareTrailBtn');let menuTargetTrailId=null,menuTargetIsShared=false;
document.addEventListener('contextmenu',e=>{e.preventDefault();trailMenu.style.display='none';menuTargetTrailId=null;menuTargetIsShared=false
if(pickTri.justPainted){pickTri.justPainted=false;return}
// if selected, operate on selected set
if(selectedSet.size>0){const onSel=isPointInSel(e.clientX,e.clientY);if(onSel){shareTrailBtn.style.display='block';trailMenu.style.left=e.clientX+'px';trailMenu.style.top=e.clientY+'px';trailMenu.style.display='block';return}else{selectedSet.clear();redrawAllSaved()}}
// otherwise find single trail
function findIn(arr,isShared){for(const st of arr){for(const p of st.points){if(Math.hypot(e.clientX-p.x,e.clientY-p.y)<20){menuTargetTrailId=st.id;menuTargetIsShared=isShared;return true}}}return false}if(findIn(savedTrails,false)||findIn(sharedTrails,true)){shareTrailBtn.style.display=menuTargetIsShared?'none':'block';trailMenu.style.left=e.clientX+'px';trailMenu.style.top=e.clientY+'px';trailMenu.style.display='block'}});
document.addEventListener('click',e=>{if(e.target.closest('#trailMenu'))return;trailMenu.style.display='none'});
deleteTrailBtn.addEventListener('click',()=>{if(selectedSet.size>0){const ids=[...selectedSet].map(i=>savedTrails[i].id);pushUndo();savedTrails=savedTrails.filter(st=>!ids.includes(st.id));selectedSet.clear();syncStorage();menuTargetTrailId=null;trailMenu.style.display='none';redrawAllSaved()}else if(menuTargetTrailId!==null){pushUndo();if(menuTargetIsShared)sharedTrails=sharedTrails.filter(st=>st.id!==menuTargetTrailId);else savedTrails=savedTrails.filter(st=>st.id!==menuTargetTrailId);syncStorage();menuTargetTrailId=null;trailMenu.style.display='none';redrawAllSaved()}});
shareTrailBtn.addEventListener('click',()=>{if(selectedSet.size>0){const indices=[...selectedSet];pushUndo();const toShare=indices.map(i=>savedTrails[i]);savedTrails=savedTrails.filter((_,i)=>!indices.includes(i));for(const t of toShare){t.id=shareIdCounter++;sharedTrails.push(t)};selectedSet.clear();syncStorage();menuTargetTrailId=null;trailMenu.style.display='none';redrawAllSaved()}else if(menuTargetTrailId!==null&&!menuTargetIsShared){pushUndo();const idx=savedTrails.findIndex(st=>st.id===menuTargetTrailId);if(idx!==-1){const t=savedTrails[idx];t.id=shareIdCounter++;sharedTrails.push(t);savedTrails.splice(idx,1);syncStorage();menuTargetTrailId=null;trailMenu.style.display='none';redrawAllSaved()}}});
const clearAllBtn=document.getElementById('clearAllBtn');
function showClearAllBtn(){clearAllBtn.style.display=(savedTrails.length||sharedTrails.length)?'block':'none'}
clearAllBtn.addEventListener('click',()=>{if(savedTrails.length||sharedTrails.length){pushUndo();savedTrails.length=0;sharedTrails.length=0;selectedSet.clear();syncStorage();showClearAllBtn();redrawAllSaved()}});
showClearAllBtn();

function drawStroke(c,p1,p2,p3,p4,size,alpha){c.beginPath();c.moveTo(p1.x,p1.y);c.bezierCurveTo(p2.x,p2.y,p3.x,p3.y,p4.x,p4.y);c.strokeStyle=`rgba(255,255,250,${alpha})`;c.lineWidth=size;c.lineCap='round';c.lineJoin='round';c.stroke();c.strokeStyle=`rgba(255,248,220,${alpha*0.35})`;c.lineWidth=size*2;c.stroke()}
function redrawAllSaved(){sctx.clearRect(0,0,W,H);function drawArr(arr,selectedOnly){for(let si=0;si<arr.length;si++){const st=arr[si];const pts=st.points;if(pts.length<4)continue;const isSel=selectedSet.has(savedTrails.indexOf(st));if(selectedOnly&&!isSel)continue;for(let i=0;i<pts.length-3;i++){const p=pts[i+1],ax=(pts[i].x+pts[i+1].x+pts[i+2].x+pts[i+3].x)/4,ay=(pts[i].y+pts[i+1].y+pts[i+2].y+pts[i+3].y)/4,alpha=0.35*(0.4+0.6*p.op);if(alpha<0.01)continue;drawStroke(sctx,pts[i],pts[i+1],pts[i+2],pts[i+3],p.sz*0.9,alpha)}}}drawArr(savedTrails);drawArr(sharedTrails)
// redraw selected with bright glow
if(selectedSet.size>0){sctx.save();for(const idx of selectedSet){const st=savedTrails[idx];const pts=st.points;if(pts.length<4)continue;for(let i=0;i<pts.length-3;i++){const p=pts[i+1];sctx.shadowColor='rgba(255,240,180,0.8)';sctx.shadowBlur=25;const ax=(pts[i].x+pts[i+1].x+pts[i+2].x+pts[i+3].x)/4,ay=(pts[i].y+pts[i+1].y+pts[i+2].y+pts[i+3].y)/4,alpha=0.35*(0.4+0.6*p.op);sctx.strokeStyle=`rgba(255,255,250,${alpha*0.9})`;sctx.lineWidth=p.sz*1.5;sctx.lineCap='round';sctx.lineJoin='round';sctx.beginPath();sctx.moveTo(pts[i].x,pts[i].y);sctx.bezierCurveTo(pts[i+1].x,pts[i+1].y,pts[i+2].x,pts[i+2].y,pts[i+3].x,pts[i+3].y);sctx.stroke()}sctx.shadowBlur=0}sctx.restore()}}
function drawTrail(){_frameOn=false;ctx.clearRect(0,0,W,H);const now=Date.now();if(trail.length>3){for(let i=0;i<trail.length-3;i++){const p=trail[i+1],age=mouseDown?0:(now-p.t)/TRAIL_TIME;if(age>1)continue;const life=1-age,ax=(trail[i].x+trail[i+1].x+trail[i+2].x+trail[i+3].x)/4,ay=(trail[i].y+trail[i+1].y+trail[i+2].y+trail[i+3].y)/4,hm=mouseDown?2:1,alpha=life*0.35*(0.4+0.6*p.op)*hm;if(alpha<0.01)continue;const sw=p.sz*life*(0.3+0.7*p.op);drawStroke(ctx,trail[i],trail[i+1],trail[i+2],trail[i+3],sw,alpha)}}while(trail.length&&(now-trail[0].t)>TRAIL_TIME&&!mouseDown)trail.shift();if(trail.length>3||mouseDown){_frameOn=true;requestAnimationFrame(drawTrail)}}
drawTrail();
document.getElementById('hamburger').addEventListener('click',function(){this.classList.toggle('active');document.getElementById('mobileMenu').classList.toggle('active')});
// ── PAGE TRANSITIONS ──
(function(){const pt=document.getElementById('pageTransition');let cx=window.innerWidth/2,cy=window.innerHeight/2;document.addEventListener('click',function(e){cx=e.clientX;cy=e.clientY},true);pt.style.transition='none';pt.style.background='#0a0a0a';pt.style.opacity='1';pt.style.pointerEvents='auto';requestAnimationFrame(function(){requestAnimationFrame(function(){pt.style.transition='opacity .8s ease';pt.style.opacity='0';setTimeout(function(){pt.style.pointerEvents='none'},900)})});document.addEventListener('click',function(e){var l=e.target.closest('a');if(!l||!l.href)return;if(l.hostname!==location.hostname)return;if(l.getAttribute('target')==='_blank')return;if(l.getAttribute('download')!==null)return;e.preventDefault();var h=l.href;pt.style.background='radial-gradient(circle at '+cx+'px '+cy+'px,rgba(255,240,180,.45) 0%,rgba(255,220,150,.2) 15%,rgba(20,18,15,.95) 40%,#0a0a0a 100%)';pt.style.transition='opacity .25s ease';pt.style.opacity='1';pt.style.pointerEvents='auto';setTimeout(function(){location.href=h},250)})})();
// ── EYE TRACKING ──
if(window.GazeTracker){setTimeout(()=>GazeTracker.start(),1500);setInterval(()=>{if(GazeTracker.isActive()){const g=GazeTracker.getGaze();if(g){mouseX=g.x;mouseY=g.y;cursorGlow.style.left=mouseX+'px';cursorGlow.style.top=mouseY+'px';cursorPoint.style.left=mouseX+'px';cursorPoint.style.top=mouseY+'px';const d=isPointOverInteractive(mouseX,mouseY,20);if(d){cursorGlow.classList.add('dim');cursorPoint.classList.add('dim')}else{cursorGlow.classList.remove('dim');cursorPoint.classList.remove('dim')}}}},30)}
</script>
</body>
</html>
